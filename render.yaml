services:
  - type: web
    name: retail-intelligence-dash
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn dash_app:server --workers 1 --threads 4 --bind 0.0.0.0:$PORT --max-requests 400 --max-requests-jitter 80 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
